<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <div class="container">
        <h2 class="h2form">CONTACT FORM</h2>
        <p class="paragraph">Where are here to help!</p>
        <form action="#">
            <div class="input-row">
                <div class="input-group">
                    <label for="firstname">FIRST NAME:</label>
                    <input type="firstname" name="firstname" id="firstname" placeholder="Please enter name" required>
                </div>

                <div class="input-group">
                    <label for="lastname">LAST NAME:</label>
                    <input type="lastname" name="lastname" id="lastname" placeholder="Please enter last name">
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" placeholder="Please enter email">
                </div>

                <div class="input-group">
                    <label for="phone-number">CELLPHONE NUMBER:</label>
                    <input type="number" name="number" id="number" placeholder="Please enter cellphone number">
                </div>
            </div>
            <div>
                <label for="comments" class="comment">WHAT DO YOU HAVE IN MIND</label>
                <textarea name="comments" id="comments" placeholder="Your Message Now!"></textarea>
            </div>
            <div>
                <button type="submit">SUBMIT</button>
            </div>
        </form>
    </div>
</body>
</html>
