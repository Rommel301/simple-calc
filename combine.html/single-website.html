<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="single-website.css">
    <!-- Optional: Link to a mapping library's CSS, e.g., Leaflet or Google Maps API -->
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>

    <main>
        <section class="contact-info">
            <h2>Our Information</h2>
            <p><strong>Address:</strong> 123 Main Street, City, Country</p>
            <p><strong>Phone:</strong> +1 (555) 123-4567</p>
            <p><strong>Email:</strong> info@example.com</p>
        </section>

        <section class="contact-form">
            <h2>Send us a Message</h2>
            <form action="#" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>

        <section class="our-location">
            <h2>Find Us on the Map</h2>
            <div id="map">
                <!-- The map will be rendered here by a mapping library (e.g., Google Maps API, Leaflet) -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Your Company</p>
    </footer>

    <!-- Optional: Link to a mapping library's JavaScript, e.g., Leaflet or Google Maps API -->
    <!-- <script src="script.js"></script> -->
</body>
</html>
